# Render Blueprint: Render reads this file to create the web service.
# See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: echo
    runtime: python
    plan: free  # spins down after 15 idle minutes; pick a paid plan in the dashboard to keep it always on
    buildCommand: pip install ".[postgres]"
    startCommand: uvicorn echo.web.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      # Asked for when you create the Blueprint:
      - key: DATABASE_URL  # your Neon connection string
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI  # https://<your subdomain>/callback
        sync: false
      # Generated once by Render:
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Fixed settings for the hosted version:
      - key: SECURE_COOKIES
        value: "true"
      - key: SHOW_DEMO_USERS  # real users see only each other
        value: "false"
      - key: ALLOW_DEMO_LOGIN  # the "Try the demo" button
        value: "true"
      - key: SEED_DEMO_LISTENERS
        value: "150"
